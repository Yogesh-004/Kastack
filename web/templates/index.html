<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kastack - Message Processing Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <style>
    body { background: #0f1220; }
    .card { border: 1px solid #262b40; background: #171a2b; }
    .table { --bs-table-bg: transparent; }
    .badge-uncertain { background: #b8860b; }
    code { color: #9cdcfe; }
    .confbar { height: 6px; border-radius: 3px; background: #2a2f47; }
    .confbar > div { height: 100%; border-radius: 3px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Kastack <span class="text-secondary small">message processing dashboard</span></a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link active" href="/">Dashboard</a>
      <a class="nav-link" href="/mandatory">Mandatory IDs</a>
      <a class="nav-link" href="/l2">L2 Assistant</a>
      <a class="nav-link" href="/healthz">Health</a>
    </div>
  </div>
</nav>

<div class="container-fluid py-3">
  <div class="row g-3 mb-3" id="statCards"></div>

  <ul class="nav nav-tabs" id="mainTabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab"
        data-bs-target="#tab-class">Classification</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab"
        data-bs-target="#tab-items">Tasks &amp; Events</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab"
        data-bs-target="#tab-sensitive">Sensitive Detections</button></li>
  </ul>

  <div class="tab-content pt-3">
    <div class="tab-pane fade show active" id="tab-class">
      <div class="row g-2 mb-2">
        <div class="col-auto">
          <select id="catFilter" class="form-select form-select-sm">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="col-auto">
          <div class="form-check mt-1">
            <input class="form-check-input" type="checkbox" id="uncertainOnly">
            <label class="form-check-label small" for="uncertainOnly">uncertain only</label>
          </div>
        </div>
        <div class="col-auto">
          <input id="qFilter" class="form-control form-control-sm"
                 placeholder="search id / sender / text">
        </div>
      </div>
      <table class="table table-sm table-hover align-middle" id="classTable">
        <thead><tr>
          <th>Message ID</th><th>Timestamp</th><th>Sender</th>
          <th>Category</th><th>Confidence</th><th>Reason</th>
          <th>Message (masked)</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <div id="classCount" class="small text-secondary"></div>
    </div>

    <div class="tab-pane fade" id="tab-items">
      <div class="row g-2 mb-2">
        <div class="col-auto">
          <select id="typeFilter" class="form-select form-select-sm">
            <option value="">All items</option>
            <option value="task">Tasks</option>
            <option value="event">Events</option>
          </select>
        </div>
        <div class="col-auto">
          <input id="qItems" class="form-control form-control-sm"
                 placeholder="search title / message id">
        </div>
      </div>
      <table class="table table-sm table-hover align-middle" id="itemTable">
        <thead><tr>
          <th>Item</th><th>Type</th><th>Title</th><th>Deadline</th>
          <th>Time</th><th>Person</th><th>Priority</th>
          <th>Location</th><th>Source</th><th>Notes</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <div id="itemCount" class="small text-secondary"></div>
    </div>

    <div class="tab-pane fade" id="tab-sensitive">
      <div class="row g-2 mb-2">
        <div class="col-auto">
          <select id="riskFilter" class="form-select form-select-sm">
            <option value="">All risks</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
          </select>
        </div>
      </div>
      <table class="table table-sm table-hover align-middle" id="sensTable">
        <thead><tr>
          <th>Message ID</th><th>Sensitivity type</th><th>Risk</th>
          <th>Masked text</th><th>Recommended action</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <div id="sensCount" class="small text-secondary"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
